name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, Android debug APK, web distribution
        run: |
          chmod +x gradlew
          ./gradlew testAndroidHostTest :app:androidApp:assembleDebug :app:webApp:wasmJsBrowserDistribution --no-daemon

  # Только в самом шаблоне: переименование не должно ломать сборку.
  rename-smoke:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Rename to a test package and build
        run: |
          # До chmod: смена прав сделала бы рабочую копию «грязной», и rename отказался бы работать.
          bash ./rename.sh --package io.github.test.smoke --name SmokeApp --display-name "Smoke App"
          chmod +x gradlew
          ./gradlew testAndroidHostTest :app:androidApp:assembleDebug :app:webApp:wasmJsBrowserDistribution --no-daemon
